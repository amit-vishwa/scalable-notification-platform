spring:
  datasource:
    url: jdbc:mysql://localhost:3306/notification_platform_test?serverTimezone=UTC
    username: notification_test
    password: ${NOTIFICATION_TEST_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
notification:
  security:
    api-keys:
      employee-service: ${NOTIFICATION_EMPLOYEE_API_KEY}
  worker:
    enabled: ${NOTIFICATION_WORKER_ENABLED:false}
    poll-enabled: ${NOTIFICATION_WORKER_POLL_ENABLED:true}
    batch-size: ${NOTIFICATION_WORKER_BATCH_SIZE:10}
    poll-delay: ${NOTIFICATION_WORKER_POLL_DELAY:PT5S}
  retry:
    max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
    initial-delay: ${NOTIFICATION_RETRY_INITIAL_DELAY:PT1M}
    max-delay: ${NOTIFICATION_RETRY_MAX_DELAY:PT15M}
    processing-lease: ${NOTIFICATION_RETRY_PROCESSING_LEASE:PT5M}

spring:
  application:
    name: scalable-notification-platform
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  task:
    scheduling:
      pool:
        size: 1
      thread-name-prefix: notification-worker-
      shutdown:
        await-termination: true
        await-termination-period: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true